version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: urjaroute-postgres
    environment:
      POSTGRES_DB: evfleet
      POSTGRES_USER: evfleet_user
      POSTGRES_PASSWORD: evfleet_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evfleet_user -d evfleet"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urjaroute-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/evfleet
      SPRING_DATASOURCE_USERNAME: evfleet_user
      SPRING_DATASOURCE_PASSWORD: evfleet_pass
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
